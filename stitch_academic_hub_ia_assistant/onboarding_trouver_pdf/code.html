<body class="bg-background min-h-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container">

<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary-fixed/40 rounded-full mix-blend-multiply filter blur-[80px] opacity-70"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-secondary-fixed/30 rounded-full mix-blend-multiply filter blur-[60px] opacity-60"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 flex flex-col h-[100dvh] w-full max-w-md mx-auto">

<header class="flex justify-end items-center px-container-margin pt-6 pb-2">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors active:scale-95">
                Passer
            </button>
</header>
<!-- Illustration Area -->
<section class="flex-1 flex items-center justify-center px-container-margin relative pb-stack-lg">
<div class="w-full aspect-square relative flex items-center justify-center">

</div>
</section>
<!-- Bottom Glassmorphic Container -->
<section class="px-container-margin pb-8 pt-4">
<div class="bg-surface/70 backdrop-blur-[24px] border border-white/40 shadow-[0px_4px_32px_rgba(0,0,0,0.08)] rounded-[32px] p-8 flex flex-col items-center text-center gap-stack-lg relative overflow-hidden">
<!-- Inner edge highlight for glass effect -->
<div class="absolute inset-0 border-[0.5px] border-white/50 rounded-[32px] pointer-events-none"></div>
<!-- Text Content -->
<div class="flex flex-col gap-stack-sm w-full relative z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Trouve le bon PDF</h1>
<p class="font-body-md text-body-md text-on-surface-variant mx-auto max-w-[280px]">
                        Explorez des milliers de documents académiques adaptés à votre université et à votre domaine.
                    </p>
</div>
<!-- Pagination & Button Container -->
<div class="w-full flex flex-col gap-stack-lg relative z-10">
<!-- Pagination Dots -->
<div class="flex items-center justify-center gap-2">
<!-- Active Dot -->
<div class="w-8 h-2 rounded-full bg-primary transition-all duration-300"></div>
<!-- Inactive Dots -->
<div class="w-2 h-2 rounded-full bg-primary-fixed transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-primary-fixed transition-all duration-300"></div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 px-6 rounded-[16px] flex items-center justify-center gap-2 shadow-[0_8px_16px_rgba(0,74,198,0.2)] hover:bg-surface-tint hover:scale-[0.98] active:scale-95 transition-all duration-200">
