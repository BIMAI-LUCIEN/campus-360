<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Campus 360 — film de présentation</title>
<!--
  Source of the landing presentation film (public/motion/presentation.mp4).
  Every frame is a pure function of time: render(t) sets the whole scene for second t,
  so film/render.cjs can step through it frame by frame. Open this file in a browser
  and add ?play to preview it in real time.
  Scenes are timed on the music (118 BPM): drop at 6.4 s, breakdown 32-40 s, last drop 48.5 s.
  Motion language: captions arrive word by word (blur to sharp, key word in violet), phones turn
  or rise in 3D, the camera zooms on the part of the screen being talked about with a spotlight,
  a cursor taps the real buttons, feature pills stack up, coins spin around the wallet.
-->
<style>
  @font-face { font-family: Sora; src: url(../app/fonts/sora-latin-400-normal.woff2); font-weight: 400; }
  @font-face { font-family: Sora; src: url(../app/fonts/sora-latin-600-normal.woff2); font-weight: 600; }
  @font-face { font-family: Sora; src: url(../app/fonts/sora-latin-700-normal.woff2); font-weight: 700; }
  @font-face { font-family: Inter; src: url(../app/fonts/inter-latin-400-normal.woff2); font-weight: 400; }
  @font-face { font-family: Inter; src: url(../app/fonts/inter-latin-500-normal.woff2); font-weight: 500; }
  @font-face { font-family: Inter; src: url(../app/fonts/inter-latin-600-normal.woff2); font-weight: 600; }
  @font-face { font-family: Serif; src: url(../app/fonts/instrument-serif-latin-400-italic.woff2); font-style: italic; }

  :root {
    --violet: #7C3AED; --violet-deep: #5B21B6; --violet-soft: #F5F3FF; --violet-line: #DDD6FE;
    --ink: #0F172A; --muted: #64748B; --faint: #E2E8F0; --sun: #FFD43B; --mint: #10B981; --coral: #FF7A59;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body { font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #fff; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }

  /* Background */
  .grid { position: absolute; inset: -200px; opacity: .5;
    background-image: linear-gradient(var(--faint) 1px, transparent 1px), linear-gradient(90deg, var(--faint) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%); mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .haze { position: absolute; left: -10%; right: -10%; height: 260px; filter: blur(60px); background: #C4B5FD; opacity: .5; border-radius: 50%; }

  /* Phone */
  .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .phone { position: absolute; width: 410px; height: 888px; border-radius: 64px; background: #0F172A; padding: 14px;
    box-shadow: 0 60px 120px -40px rgba(91,33,182,.55), 0 30px 60px -30px rgba(15,23,42,.45), inset 0 0 0 2px #1E293B; }
  .phone .notch { position: absolute; left: 50%; top: 26px; width: 118px; height: 32px; margin-left: -59px; border-radius: 20px; background: #0F172A; z-index: 6; }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 51px; overflow: hidden; background: #fff; }
  .phone .screen img { position: absolute; left: 0; top: 0; width: 100%; height: auto; transform-origin: 50% 0; }
  .phone .glare { position: absolute; inset: 0; border-radius: 51px; pointer-events: none; z-index: 5;
    background: linear-gradient(115deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 28%); }
  .spot { position: absolute; border-radius: 16px; z-index: 3; box-shadow: 0 0 0 2000px rgba(15,23,42,0); outline: 3px solid rgba(124,58,237,0); outline-offset: 2px; }
  .cursor { position: absolute; z-index: 4; width: 0; height: 0; }
  .cursor svg { position: absolute; left: -6px; top: -4px; filter: drop-shadow(0 6px 10px rgba(15,23,42,.35)); }
  .cursor .ripple { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--violet); opacity: 0; }

  /* Captions */
  .kicker { font-family: Sora; font-weight: 600; font-size: 22px; letter-spacing: .22em; color: var(--violet); display: flex; align-items: center; gap: 14px; }
  .kicker i { display: inline-block; width: 44px; height: 3px; background: var(--violet); border-radius: 2px; }
  .cap { position: absolute; font-family: Sora; font-weight: 700; font-size: 82px; line-height: 1.08; letter-spacing: -.035em; }

  .search { position: absolute; left: 50%; top: 50%; width: 1080px; height: 128px; margin: -64px 0 0 -540px; border-radius: 999px; background: #fff;
    display: flex; align-items: center; gap: 26px; padding: 0 40px; box-shadow: 0 40px 80px -30px rgba(15,23,42,.55); font-family: Sora; font-weight: 600; font-size: 50px; color: var(--ink); }

  .search .go { margin-left: auto; width: 84px; height: 84px; border-radius: 50%; background: var(--violet); display: grid; place-items: center; }

  .hud { position: absolute; left: 80px; right: 80px; bottom: 54px; display: flex; justify-content: space-between; align-items: center; font-family: Sora; font-weight: 600; font-size: 20px; color: var(--muted); }

  .cta { display: inline-flex; align-items: center; gap: 16px; padding: 28px 46px; border-radius: 999px; background: var(--violet); color: #fff; font-family: Sora; font-weight: 700; font-size: 34px; box-shadow: 0 30px 60px -24px rgba(124,58,237,.7); }
  .badge { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; font-family: Sora; font-weight: 600; font-size: 22px; }
</style>

<script>
const SCREENS = '../public/images/screens/';
const DURATION = 60;
const FPS = 30;
const BEAT = 60 / 118;

// ─── math ───────────────────────────────────────────────────────────────
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const raw = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const inExpo = (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10));
const inOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outBack = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const ein = (t, a, b, f = outExpo) => f(raw(t, a, b));
const $ = (id) => document.getElementById(id);
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const show = (el, on) => { el.style.display = on ? '' : 'none'; };

// ─── captions: word by word ─────────────────────────────────────────────
// Lines use *word* for violet and _word_ for the italic serif accent.
function makeCaption(host, lines, cls = '') {
  const el = document.createElement('div');
  el.className = 'cap ' + cls;
  const words = [];
  lines.forEach((line) => {
    const row = document.createElement('span');
    row.className = 'row';
    line.split(' ').forEach((tok) => {
      const w = document.createElement('span');
      w.className = 'w';
      let text = tok;
      if (/^\*.*\*[.,!:]?$/.test(tok)) { w.classList.add('acc'); text = tok.replace(/\*/g, ''); }
      if (/^_.*_[.,!:]?$/.test(tok)) { w.classList.add('acc', 'ser'); text = tok.replace(/_/g, ''); }
      w.textContent = text.replace(/~/g, ' ');
      row.appendChild(w);
      words.push(w);
    });
    el.appendChild(row);
  });
  host.appendChild(el);
  return { el, words };
}
// Words rise from a blur one after another, then leave upward the same way.
function renderCaption(cap, t, a, b, step = 0.075) {
  const on = t >= a - 0.05 && t <= b + 0.6;
  show(cap.el, on);
  if (!on) return;
  cap.words.forEach((w, i) => {
    const pin = ein(t, a + i * step, a + i * step + 0.55);
    const pout = ein(t, b + i * 0.03, b + i * 0.03 + 0.35, inExpo);
    css(w, {
      opacity: clamp(raw(t, a + i * step, a + i * step + 0.3)) * (1 - pout),
      transform: `translateY(${(1 - pin) * 46 - pout * 40}px) scale(${lerp(0.92, 1, pin)})`,
      filter: `blur(${(1 - pin) * 14 + pout * 14}px)`,
    });
  });
}

// ─── phone with camera, spotlight and cursor ────────────────────────────
function makePhone(host, files, left, top) {
  const cam = document.createElement('div');
  cam.className = 'cam';
  const phone = document.createElement('div');
  phone.className = 'phone';
  phone.innerHTML = '<div class="notch"></div><div class="screen"></div><div class="glare"></div>';
  css(phone, { left: left + 'px', top: top + 'px' });
  const screen = phone.querySelector('.screen');
  const imgs = files.map((f) => {
    const img = document.createElement('img');
    img.src = SCREENS + f;
    screen.appendChild(img);
    return img;
  });
  const spot = document.createElement('div');
  spot.className = 'spot';
  screen.appendChild(spot);
  const cursor = document.createElement('div');
  cursor.className = 'cursor';
  cursor.innerHTML = '<div class="ripple"></div><svg width="40" height="48" viewBox="0 0 22 26"><path d="M2 2 L2 21 L7 16.5 L10.5 24 L14 22.5 L10.6 15.2 L17.5 15 Z" fill="#0F172A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  screen.appendChild(cursor);
  cam.appendChild(phone);
  host.appendChild(cam);
  return { cam, phone, imgs, spot, cursor, left, top };
}
const SW = 382, SH = 860; // screen size inside the frame

// Keyframed value: [[time, value], ...] eased between keys.
function keys(t, list, f = inOut) {
  if (t <= list[0][0]) return list[0][1];
  for (let i = 1; i < list.length; i++) {
    if (t <= list[i][0]) {
      const [t0, v0] = list[i - 1], [t1, v1] = list[i];
      const p = f(raw(t, t0, t1));
      return Array.isArray(v0) ? v0.map((v, k) => lerp(v, v1[k], p)) : lerp(v0, v1, p);
    }
  }
  return list[list.length - 1][1];
}

// ─── scenes ─────────────────────────────────────────────────────────────
// Each scene: phone side + entrance, screens with switch times, captions, zoom keys
// (scale and focus point in screen fractions), spotlight boxes, cursor path with taps.
const SCENES = [
  { start: 11.5, end: 17, side: 'right', enter: 'turn', kicker: '01 · ACCUEIL',
    screens: [['accueil.webp', 0]],
    captions: [
      { a: 0.45, b: 2.55, lines: ['Ton accueil,', 'pensé pour', '_ta~filière._'] },
      { a: 2.85, b: 5.0, lines: ['Les offres', 'classées par', '*correspondance.*'] },
    ],
    zoom: [[0, [1, 0.5, 0.5]], [2.7, [1, 0.5, 0.5]], [3.4, [1.85, 0.36, 0.86]], [5.0, [1.92, 0.36, 0.86]]],
    spots: [{ a: 3.3, b: 5.3, box: [0.04, 0.775, 0.66, 0.135] }],
    cursor: null },
  { start: 17, end: 23.5, side: 'left', enter: 'rise', kicker: '02 · STAGES & EMPLOIS',
    screens: [['stages.webp', 0], ['offre.webp', 2.45]],
    captions: [
      { a: 0.4, b: 2.45, lines: ['Des stages', 'qui te', '*correspondent.*'] },
      { a: 2.75, b: 4.6, lines: ['*65~%* de match,', 'tes points forts,', 'un conseil.'] },
      { a: 4.85, b: 6.1, lines: ['Postule', 'en *1~clic.*'] },
    ],
    zoom: [[0, [1, 0.5, 0.5]], [3.0, [1, 0.5, 0.5]], [3.7, [1.9, 0.72, 0.56]], [4.6, [1.95, 0.7, 0.58]], [5.2, [1.6, 0.68, 0.93]], [6.2, [1.66, 0.68, 0.93]]],
    spots: [{ a: 3.6, b: 4.7, box: [0.6, 0.495, 0.36, 0.055] }, { a: 5.2, b: 6.3, box: [0.45, 0.905, 0.52, 0.07] }],
    cursor: [[1.1, [0.95, 1.1]], [2.0, [0.42, 0.87]], [2.25, 'tap'], [4.9, [0.42, 0.87]], [5.45, [0.72, 0.94]], [5.7, 'tap']] },
  { start: 23.5, end: 32, side: 'right', enter: 'turnBack', kicker: '03 · CANDIDATURE',
    screens: [['candidature.webp', 0]],
    captions: [
      { a: 0.45, b: 2.7, lines: ['*Préparer,*', 'vérifier,', 'envoyer.'] },
      { a: 3.0, b: 5.4, lines: ['Choisis', 'ton *modèle*', 'de CV.'] },
      { a: 5.7, b: 8.0, lines: ['CV adapté', '+ lettre, dès', '*300~FCFA.*'] },
    ],

function buildScenes() {

  SCENES.forEach((s) => {

    const kicker = document.createElement('div');
    kicker.className = 'kicker abs';
    kicker.innerHTML = `<i></i><span>${s.kicker}</span>`;

    root.appendChild(kicker);
    const caps = s.captions.map((c) => {
      const cap = makeCaption(root, c.lines);
      css(cap.el, { left: textX + 'px', top: '320px' });
      return cap;
    });
    let sceneCoins = [];
    if (s.coins) {
      sceneCoins = [[-150, 210, 0.9, 0], [330, 140, 0.7, 1.3], [-210, 650, 0.75, 2.1], [360, 560, 1.05, 0.6], [100, -20, 0.55, 1.7], [260, 830, 0.6, 2.6]].map(([x, y, sc, ph0]) => {
        const c = document.createElement('div');
        c.className = 'coin';
        c.innerHTML = '<div class="face">C</div>';
        css(c, { left: phoneX + 205 + x + 'px', top: 96 + y + 'px' });
        root.appendChild(c);
        return { el: c, sc, ph0 };
      });
    }
    host.appendChild(root);
    built.push({ s, root, ph, kicker, caps, coins: sceneCoins });

  // Pills scene
  const root = document.createElement('div');
  root.className = 'layer';
  const ph = makePhone(root, ['ressources.webp', 'creer.webp'], 300, 96);
  const kicker = document.createElement('div');

  kicker.innerHTML = '<i></i><span>04 · RÉVISIONS &amp; RÉDACTION</span>';
  css(kicker, { left: '900px', top: '200px' });
  root.appendChild(kicker);
  const list = document.createElement('div');
  list.className = 'abs';
  css(list, { left: '900px', top: '0', width: '900px', height: '1080px' });
  const pills = PILLS.items.map((p) => {

  host.appendChild(root);
  pillsBuilt = { root, ph, kicker, pills };

  CHAPTERS.slice(0, -1).forEach(() => $('dots').appendChild(document.createElement('span')));
}

function renderPhone(ph, s, lt, len, pin, pout) {
  const dir = s.side === 'right' ? 1 : -1;
  // Entrance styles borrowed from the reference films: edge-on turn, or a tilted rise.
  let rx = 0, ry = 0, rz = 0, tx = 0, ty = 0;
  if (s.enter === 'turn' || s.enter === 'turnBack') {
    const sgn = s.enter === 'turn' ? 1 : -1;
    ry = lerp(88 * sgn, -10 * dir, pin);
    tx = lerp(120 * dir, 0, pin);
    rx = lerp(8, 3, pin);
  } else {
    rx = lerp(58, 4, pin);
    ty = lerp(520, 0, pin);
    rz = lerp(-8 * dir, 0, pin);
    ry = lerp(0, -10 * dir, pin);
  }
  ry += Math.sin(lt * 0.8) * 3;
  ty += Math.sin(lt * 1.1) * 6;
  // Exit: slides away with blur.
  tx += pout * 1000 * dir;
  ry += pout * 35 * dir;
  css(ph.phone, {
    transform: `perspective(2200px) translate(${tx}px, ${ty}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`,
    opacity: Math.min(clamp(pin * 2.2), 1 - pout),
    filter: `blur(${pout * 12}px)`,
  });

  // Camera: scale around a focus point so that point lands near the phone centre.
  const [sc, fx, fy] = s.zoom ? keys(lt, s.zoom) : [1, 0.5, 0.5];
  const px = ph.left + 14 + fx * SW, py = ph.top + 14 + fy * SH;
  const cx = ph.left + 205, cy = 540;
  const k = raw(sc, 1, 1.2); // blend the focus target in as the zoom starts
  const targetX = lerp(px, cx, k), targetY = lerp(py, cy, k);
  css(ph.cam, { transform: `translate(${targetX - sc * px}px, ${targetY - sc * py}px) scale(${sc})` });

  // Screens crossfade with a push.
  ph.imgs.forEach((img, i) => {
    const from = s.screens[i][1];
    const next = s.screens[i + 1] ? s.screens[i + 1][1] : Infinity;
    const a = i === 0 ? 1 : ein(lt, from, from + 0.45);
    const b = ein(lt, next, next + 0.45);
    css(img, { opacity: a * (1 - b), transform: `translateX(${(1 - a) * 80 - b * 80}px)` });
  });

  // Spotlight on the part being talked about.
  let spotOn = 0, box = [0, 0, 0, 0];
  (s.spots || []).forEach((sp) => {
    const p = Math.min(ein(lt, sp.a, sp.a + 0.4), 1 - ein(lt, sp.b - 0.3, sp.b));
    if (p > spotOn) { spotOn = p; box = sp.box; }
  });
  css(ph.spot, {
    left: box[0] * SW + 'px', top: box[1] * SH + 'px', width: box[2] * SW + 'px', height: box[3] * SH + 'px',
    boxShadow: `0 0 0 2000px rgba(15,23,42,${0.42 * spotOn})`,
    outlineColor: `rgba(124,58,237,${spotOn})`,
    transform: `scale(${lerp(1.15, 1, spotOn)})`,
  });

  // Cursor path with taps.
  const path = s.cursor;
  if (!path) { css(ph.cursor, { opacity: 0 }); return; }
  const moves = path.filter((p) => p[1] !== 'tap');
  const taps = path.filter((p) => p[1] === 'tap').map((p) => p[0]);
  const [nx, ny] = keys(lt, moves);
  const vis = Math.min(ein(lt, moves[0][0], moves[0][0] + 0.3), 1 - ein(lt, moves[moves.length - 1][0] + 0.6, moves[moves.length - 1][0] + 0.9));
  let press = 1, ripple = 0, rippleS = 0;
  taps.forEach((tp) => {
    const d = lt - tp;
    if (d > -0.1 && d < 0.2) press = Math.min(press, 0.82);
    if (d >= 0 && d < 0.6) { ripple = 1 - d / 0.6; rippleS = lerp(0.3, 1.6, d / 0.6); }
  });
  css(ph.cursor, { left: nx * SW + 'px', top: ny * SH + 'px', opacity: vis });
  ph.cursor.querySelector('svg').style.transform = `scale(${press})`;
  css(ph.cursor.querySelector('.ripple'), { opacity: ripple, transform: `scale(${rippleS})` });
}

function renderScene(b, t) {
  const { s } = b;
  const lt = t - s.start, len = s.end - s.start;
  const active = t >= s.start - 0.01 && t < s.end + 0.5;
  show(b.root, active);
  if (!active) return;
  const pin = ein(lt, 0, 1.0);
  const pout = ein(lt, len - 0.35, len + 0.45, inExpo);
  renderPhone(b.ph, s, lt, len, pin, pout);
  const ko = ein(lt, len - 0.4, len, inExpo);
  css(b.kicker, { opacity: ein(lt, 0.1, 0.5) * (1 - ko), transform: `translateX(${(1 - ein(lt, 0.1, 0.7)) * -40}px)` });
  b.caps.forEach((cap, i) => renderCaption(cap, lt, s.captions[i].a, s.captions[i].b));
  b.coins.forEach((c, i) => {
    const appear = ein(lt, 5.6 + i * 0.12, 6.2 + i * 0.12, outBack);
    const early = ein(lt, 0.8 + i * 0.1, 1.4 + i * 0.1);
    const p = Math.max(early * 0.55, appear);
    const spin = (lt * 2.4 + c.ph0) * Math.PI;
    css(c.el, {
      opacity: clamp(p) * (1 - pout),
      transform: `translate(${pout * 900}px, ${Math.sin(lt * 1.6 + c.ph0) * 18}px) scale(${c.sc * p})`,
    });
    c.el.firstChild.style.transform = `scaleX(${Math.max(0.12, Math.abs(Math.cos(spin)))})`;
  });
}

function renderPills(t) {
  const P = pillsBuilt;
  const lt = t - PILLS.start, len = PILLS.end - PILLS.start;
  const active = t >= PILLS.start - 0.01 && t < PILLS.end + 0.5;
  show(P.root, active);
  if (!active) return;
  const pin = ein(lt, 0, 1.0), pout = ein(lt, len - 0.35, len + 0.45, inExpo);
  renderPhone(P.ph, { side: 'left', enter: 'rise', screens: [['ressources.webp', 0], ['creer.webp', 3.8]],
    zoom: [[0, [1, 0.5, 0.5]], [0.8, [1.08, 0.5, 0.5]], [3.6, [1.12, 0.5, 0.55]], [4.4, [1.05, 0.5, 0.4]], [7.6, [1.1, 0.5, 0.42]]] }, lt, len, pin, pout);
  css(P.kicker, { opacity: ein(lt, 0.1, 0.5) * (1 - ein(lt, len - 0.4, len, inExpo)) });
  // The list scrolls so the newest pill sits at the centre; older ones fade and blur.
  const shown = PILLS.items.filter((p) => lt >= p.at).length;
  const scroll = PILLS.items.reduce((acc, p, i) => acc + ein(lt, p.at, p.at + 0.55) * (i > 0 ? 1 : 0), 0);
  P.pills.forEach((el, i) => {
    const it = PILLS.items[i];
    const pin2 = ein(lt, it.at, it.at + 0.6, outBack);
    const dist = scroll - i; // 0 = newest
    const y = 500 - dist * 118;
    const fade = clamp(1 - Math.max(0, dist - 0.2) * 0.32);
    const exit = ein(lt, len - 0.6 + i * 0.03, len - 0.1 + i * 0.03, inExpo);
    css(el, {
      top: y + 'px',
      opacity: clamp(raw(lt, it.at, it.at + 0.25)) * fade * clamp((y - 240) / 120) * (1 - exit),
      transform: `translateX(${(1 - pin2) * 120 + exit * 200}px) scale(${lerp(0.85, 1, pin2) * (1 - Math.max(0, dist) * 0.04)})`,
      filter: `blur(${Math.max(0, dist - 0.5) * 2.2 + exit * 10}px)`,
    });
  });
}

let introCap, outroCap, ctaTag;
function renderIntro(t) {
  const on = t < 6.6;
  show($('intro'), on);
  if (!on) return;
  ['arc1', 'arc2', 'arc3'].forEach((id, i) => {
    $(id).style.strokeDashoffset = 100 - 100 * ein(t, 0.3 + i * 0.4, 1.2 + i * 0.4, inOut);
  });
  $('arrow').style.transform = `scale(${ein(t, 1.7, 2.2, outBack)})`;
  $('dot').style.transform = `scale(${ein(t, 2.0, 2.5, outBack)})`;
  const lift = ein(t, 2.6, 3.4, inOut);
  const spin = lerp(-120, 0, ein(t, 0.2, 2.4, inOut));
  css($('mono'), { transform: `translateY(${-110 * lift}px) rotate(${spin}deg) scale(${lerp(1, 0.84, lift)})` });
  const wm = $('wordmark');
  if (!wm.childElementCount) {
    'Campus 360'.split('').forEach((ch) => {
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.display = 'inline-block';
      if (/\d/.test(ch)) s.style.color = 'var(--violet)';
      wm.appendChild(s);
    });
  }
  [...wm.children].forEach((s, i) => {
    const p = ein(t, 2.9 + i * 0.05, 3.6 + i * 0.05);
    css(s, { transform: `translateY(${(1 - p) * 60}px)`, opacity: p, filter: `blur(${(1 - p) * 10}px)` });
  });
  renderCaption(introCap, t, 3.7, 9, 0.11);
  const pw = ein(t, 5.75, 6.4, inExpo);
  css($('wipe'), { transform: `scale(${pw * 460})` });
  const exit = ein(t, 5.4, 6.4, inExpo);
  css($('mono'), { opacity: 1 - exit });
  css(wm, { opacity: 1 - exit });
  css(introCap.el, { opacity: 1 - exit });
}

function renderHook(t) {
  const on = t >= 6.35 && t < 11.9;
  show($('hook'), on);
  if (!on) return;
  const lt = t - 6.4;
  ['ring1', 'ring2', 'ring3'].forEach((id, i) => {
    const phase = ((lt + i * BEAT * 0.66) % (BEAT * 2)) / (BEAT * 2);
    const size = 300 + phase * 1500;
    css($(id), { width: size + 'px', height: size + 'px', marginLeft: -size / 2 + 'px', marginTop: -size / 2 + 'px', opacity: (1 - phase) * 0.9 });
  });
  // A search bar types the student's question, then the button is hit.
  const query = 'stage informatique à Douala';
  const pBar = ein(lt, 0, 0.45, outBack);
  const n = Math.floor(clamp(raw(lt, 0.3, 1.25)) * query.length);
  $('typed').textContent = query.slice(0, n);
  $('caret').style.opacity = Math.floor(lt * 4) % 2 ? 0.2 : 1;
  const hit = ein(lt, 1.3, 1.45) * (1 - ein(lt, 1.45, 1.6));
  $('go').style.transform = `scale(${1 - hit * 0.18})`;
  const barOut = ein(lt, 1.55, 1.9, inExpo);
  css($('search'), { opacity: clamp(raw(lt, 0, 0.15)) * (1 - barOut), transform: `scale(${lerp(0.6, 1, pBar) * (1 + barOut * 0.4)})`, filter: `blur(${barOut * 16}px)` });
  // Then three verbs on the beat, and the promise.
  const starts = [1.7, 1.7 + BEAT * 1.5, 1.7 + BEAT * 3];
  starts.forEach((a, i) => {
    const pin = ein(lt, a, a + 0.32);
    const end = a + BEAT * 1.5;
    const pout = ein(lt, end - 0.1, end + 0.2, inExpo);
    css($('w' + i), {
      opacity: lt >= a - 0.01 ? clamp(raw(lt, a, a + 0.12)) * (1 - pout) : 0,
      transform: `translateY(${(1 - pin) * 120 - pout * 120}px) scale(${lerp(1.25, 1, pin)})`,
      filter: `blur(${(1 - pin) * 16 + pout * 16}px)`,
    });
  });
  const ta = 1.7 + BEAT * 4.5;
  const pA = ein(lt, ta, ta + 0.45, outBack);
  const pB = ein(lt, ta + 0.5, ta + 1.0, outBack);
  css($('tagA'), { display: 'inline-block', opacity: clamp(raw(lt, ta, ta + 0.15)), transform: `scale(${lerp(0.6, 1, pA)})`, filter: `blur(${(1 - clamp(pA)) * 12}px)` });
  css($('tagB'), { opacity: clamp(raw(lt, ta + 0.5, ta + 0.65)), transform: `translateY(${(1 - pB) * 40}px) scale(${lerp(0.7, 1, pB)})` });
  const up = ein(lt, 4.75, 5.4, inOut);
  css($('hook'), { transform: `translateY(${-up * 100}%)`, borderRadius: `0 0 ${up * 400}px ${up * 400}px` });
}

let fanPhones = [];
function renderOutro(t) {
  const on = t >= 48.3;
  show($('outro'), on);
  if (!on) return;
  const lt = t - 48.5;
  const gone = ein(lt, 4.2, 5.0, inExpo);
  fanPhones.forEach((ph, i) => {
    const k = i - 2;
    const pin = ein(lt, 0.1 + Math.abs(k) * 0.12, 1.1 + Math.abs(k) * 0.12);
    const sway = Math.sin(lt * 0.8 + i) * 6;
    css(ph.phone, {
      left: 960 - 205 + k * 330 + 'px', top: 300 + Math.abs(k) * 60 + 'px', zIndex: 10 - Math.abs(k),
      transform: `perspective(2400px) translateY(${(1 - pin) * 700 + gone * (900 + Math.abs(k) * 100) + sway}px) rotateZ(${k * 7 * pin}deg) rotateY(${-k * 8 + (1 - pin) * 60 * Math.sign(k || 1)}deg) scale(${(k === 0 ? 0.92 : 0.8) * lerp(0.7, 1, pin)})`,
      opacity: Math.min(1, pin * 2),
      filter: `blur(${gone * 8}px)`,
    });
  });
  renderCaption(outroCap, lt, 0.35, 4.0, 0.09);

  const c0 = lt - 4.9;
  show($('ctaBox'), c0 > -0.05);
  const pm = ein(c0, 0, 0.7, outBack);
  css($('ctaMono'), { transform: `scale(${pm}) rotate(${lerp(-90, 0, ein(c0, 0, 0.9))}deg)`, opacity: clamp(raw(c0, 0, 0.2)) });
  const pn = ein(c0, 0.25, 0.9);
  css($('ctaName'), { opacity: pn, transform: `translateY(${(1 - pn) * 40}px)`, filter: `blur(${(1 - pn) * 10}px)` });
  renderCaption(ctaTag, c0, 0.7, 99, 0.1);
  const pb = ein(c0, 1.2, 1.8, outBack);
  const tap = c0 - 2.9;
  const press = tap > -0.1 && tap < 0.2 ? 0.94 : 1;
  css($('ctaBtnWrap'), { opacity: clamp(raw(c0, 1.2, 1.4)), transform: `scale(${lerp(0.7, 1, pb) * press})` });
  // Cursor glides in and taps the download button.
  const cur = $('ctaCursor');
  const cp = ein(c0, 2.0, 2.8, inOut);
  css(cur, { opacity: clamp(raw(c0, 2.0, 2.2)) * (1 - ein(c0, 4.2, 4.6)), transform: `translate(${(1 - cp) * 260}px, ${(1 - cp) * 180}px)` });
  const rp = tap >= 0 && tap < 0.6 ? tap / 0.6 : -1;
  css(cur.querySelector('.ripple'), { opacity: rp >= 0 ? 1 - rp : 0, transform: `scale(${rp >= 0 ? lerp(0.3, 1.8, rp) : 0})` });
  const pu = ein(c0, 1.6, 2.2);
  css($('ctaUrl'), { opacity: pu, transform: `translateY(${(1 - pu) * 20}px)` });
  [...$('ctaBadges').children].forEach((b, i) => {
    const p = ein(c0, 3.3 + i * 0.15, 3.8 + i * 0.15, outBack);
    css(b, { opacity: clamp(raw(c0, 3.3 + i * 0.15, 3.45 + i * 0.15)), transform: `translateY(${(1 - p) * 30}px) scale(${lerp(0.8, 1, p)})` });
  });
}

function renderHud(t) {
  const on = t > 11.6 && t < 48.5;
  const p = Math.min(ein(t, 11.6, 12.4), 1 - ein(t, 48.0, 48.5));
  css($('hud'), { opacity: on ? p : 0 });
  let idx = -1;
  for (let i = 0; i < CHAPTERS.length - 1; i++) if (t >= CHAPTERS[i] && t < CHAPTERS[i + 1]) idx = i;
  [...$('dots').children].forEach((d, i) => {
    css(d, { width: (i === idx ? 40 : 8) + 'px', background: i === idx ? 'var(--violet)' : i < idx ? 'var(--violet-line)' : 'var(--faint)' });
  });
  $('hudLabel').textContent = idx >= 0 ? `0${idx + 1} / 0${CHAPTERS.length - 1}` : 'campus360b.site';
}

function render(t) {
  renderBackground(t);
  renderIntro(t);
  renderHook(t);
  built.forEach((b) => renderScene(b, t));
  renderPills(t);
  renderOutro(t);
  renderHud(t);
  const flash = (t >= 48.5 ? Math.max(1 - ein(t, 48.5, 48.9), 0) * 0.55 : 0) + ein(t, 59.3, 60, inOut);
  css($('flash'), { opacity: flash });
}

async function ready() {
  buildScenes();
  introCap = makeCaption($('intro'), ['Ton parcours étudiant, à _360°_'], '');
  css(introCap.el, { left: '0', right: '0', top: '660px', textAlign: 'center', fontSize: '46px', fontWeight: '600', color: 'var(--muted)' });
  outroCap = makeCaption($('outro'), ['Ton _premier_ stage', 'commence ici.']);
  css(outroCap.el, { left: '0', right: '0', top: '80px', textAlign: 'center', fontSize: '92px' });
  ctaTag = makeCaption($('ctaTag'), ['Ton parcours étudiant, à *360°*']);
  css(ctaTag.el, { position: 'relative', fontSize: '40px', fontWeight: '600', color: 'var(--muted)', textAlign: 'center' });
  fanPhones = ['candidature.webp', 'stages.webp', 'accueil.webp', 'ressources.webp', 'profil.webp'].map((f) => makePhone($('fan'), [f], 0, 0));
  fanPhones.forEach((ph) => { ph.imgs[0].style.opacity = 1; ph.cursor.style.opacity = 0; });
  render(0);
  await document.fonts.ready;
  await Promise.all([...document.images].map((img) => img.decode().catch(() => undefined)));
  render(0);
  return true;
}
window.render = render;
window.filmReady = ready();
window.FILM = { DURATION, FPS };

if (location.search.includes('play')) {
  window.filmReady.then(() => {
    const start = performance.now();
    const loop = () => { render(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
