<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lecteur PDF Campus 360</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0f19;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-group { display: flex; align-items: center; gap: 8px; }
    button {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #334155; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #page-info { font-size: 13px; color: #94a3b8; font-weight: 500; }
    #viewer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 8px;
      gap: 16px;
      min-height: calc(100vh - 54px);
    }
    .pdf-page-canvas {
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      max-width: 100%;
      height: auto;
      background: white;
    }
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      gap: 12px;
      color: #94a3b8;
      font-size: 14px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #38bdf8;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-box {
      display: none;
      margin: 40px auto;
      max-width: 480px;
      padding: 20px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      text-align: center;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="btn-group">
      <button id="prev-page" disabled>&larr; Précédent</button>
      <span id="page-info">Page <span id="current-page">1</span> / <span id="total-pages">-</span></span>
      <button id="next-page" disabled>Suivant &rarr;</button>
    </div>
    <div class="btn-group">
      <button id="zoom-out">-</button>
      <button id="zoom-in">+</button>
    </div>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <p>Chargement du document PDF...</p>
  </div>

  <div id="error-box"></div>
  <div id="viewer-container"></div>

  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const params = new URLSearchParams(window.location.search);
    const pdfUrl = params.get('url');
    const container = document.getElementById('viewer-container');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('error-box');
    const currentPageSpan = document.getElementById('current-page');
    const totalPagesSpan = document.getElementById('total-pages');
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');

    let pdfDoc = null;
    let currentPage = 1;
    let scale = 1.2;

    if (!pdfUrl) {
      loader.style.display = 'none';
      errorBox.style.display = 'block';
      errorBox.textContent = 'Aucune URL de PDF fournie.';
    } else {
      loadPDF(pdfUrl);
    }

    async function loadPDF(url) {
      try {
        const loadingTask = pdfjsLib.getDocument({
          url: url,
          cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
          cMapPacked: true,
        });

        pdfDoc = await loadingTask.promise;
        loader.style.display = 'none';
        totalPagesSpan.textContent = pdfDoc.numPages;
        renderPage(currentPage);
        updateNav();
      } catch (err) {
        loader.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.textContent = 'Impossible de charger le fichier PDF : ' + (err.message || err);
      }
    }

    async function renderPage(pageNum) {
      if (!pdfDoc) return;
      container.innerHTML = '';
      currentPageSpan.textContent = pageNum;

      try {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: scale });
        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page-canvas';
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        container.appendChild(canvas);

        await page.render({
          canvasContext: ctx,
          viewport: viewport
        }).promise;
      } catch (e) {
        console.error('Error rendering page:', e);
      }
    }

    function updateNav() {
      if (!pdfDoc) return;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= pdfDoc.numPages;
    }

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage(currentPage);
        updateNav();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (pdfDoc && currentPage < pdfDoc.numPages) {
        currentPage++;
        renderPage(currentPage);
        updateNav();
      }
    });

    zoomInBtn.addEventListener('click', () => {
      scale += 0.2;
      renderPage(currentPage);
    });

    zoomOutBtn.addEventListener('click', () => {
      if (scale > 0.6) {
        scale -= 0.2;
        renderPage(currentPage);
      }
    });
  </script>
</body>
</html>
