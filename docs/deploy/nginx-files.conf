# files.campus360b.site — uploads and signed file delivery (Module 19).
# Proxies to the mobile-api instance running on the VPS (pm2 campus360-mobile-api, port 3002).
# Only the upload route and the signed file route are exposed; everything else is 404.
#
# Install: /etc/nginx/sites-available/files.campus360b.site, symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx`. Certificate: see docs/deploy/FILES_HOST.md.

server {
    listen 80;
    listen [::]:80;
    server_name files.campus360b.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.campus360b.site;

    ssl_certificate     /etc/letsencrypt/live/files.campus360b.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.campus360b.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 20 MB per document + multipart overhead (the API enforces the exact limits).
    client_max_body_size 25m;
    client_body_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload / list / delete files of a document (session checked by the API).
    location ~ "^/api/mobile/documents/[0-9a-fA-F-]{36}/files$" {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 90s;
    }

    # Signed file delivery (HMAC + expiry checked by the API).
    location ~ "^/api/files/[0-9a-fA-F-]{36}$" {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
