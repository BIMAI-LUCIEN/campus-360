name: Deploy Mobile API to Vercel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview
  push:
    branches:
      - main
    paths:
      - 'mobile-api/**'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MOBILE_API_PROJECT_ID }}

jobs:
  deploy-mobile-api:
    name: Deploy mobile-api to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-api/package-lock.json

      - name: Install dependencies
        run: cd mobile-api && npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: cd mobile-api && vercel pull --yes --environment=${{ inputs.environment || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel App
        run: cd mobile-api && vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: cd mobile-api && vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
