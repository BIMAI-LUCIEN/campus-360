name: Design guard (hardcoded colors)

# Blocks any change that adds hardcoded colors to the mobile app instead of using the
# Clean White & Royal Violet tokens from src/theme/stitch.ts. Baseline:
# scripts/hardcoded-colors-baseline.json (lower it with `npm run lint:colors:update`).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/check-hardcoded-colors.mjs'
      - 'scripts/hardcoded-colors-baseline.json'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/check-hardcoded-colors.mjs'
      - 'scripts/hardcoded-colors-baseline.json'

jobs:
  colors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pure Node script: no npm install needed.
      - run: node scripts/check-hardcoded-colors.mjs
