name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild of all apps"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "landing-site/**"
      - "mobile-api/**"
      - "recruiter-web/**"
      - "scripts/deploy-vps.sh"
      - ".github/workflows/deploy-vps.yml"

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy-vps:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            chmod +x /opt/campus-360/scripts/deploy-vps.sh
            /opt/campus-360/scripts/deploy-vps.sh ${{ inputs.force && '--force' || '' }}
