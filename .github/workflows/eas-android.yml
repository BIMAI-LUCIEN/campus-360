name: Build Android APK (EAS local, GitHub)

# Builds the Android APK on GitHub's runner with `eas build --local`.
# The build does NOT use Expo's cloud builders, so it does not consume the Expo
# Free plan quota. Public repository => GitHub Actions minutes are free.
#
# Signing: the APK is signed with the keystore already stored for the project
# on Expo (remote credentials). Same key every time => installs over the previous
# version on phones. Never commit a keystore to the repository.
#
# Required repository secret:
#   - EXPO_TOKEN: Expo access token (scope: the project owned by miguelvinijr237).
#
# Manual only (workflow_dispatch): run it from the Actions tab when a native
# change (icon, plugins, version, permissions) must ship.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview

permissions:
  contents: write

jobs:
  build-android-apk:
    name: EAS local · android · ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (Android build needs JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Give Gradle enough memory (Metaspace OOM otherwise)
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> "$HOME/.gradle/gradle.properties"
          echo "org.gradle.daemon=false" >> "$HOME/.gradle/gradle.properties"
          cat "$HOME/.gradle/gradle.properties"

      - name: Build APK locally on the runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g
        run: |
          set -euo pipefail
          echo "::add-mask::$EXPO_TOKEN"
          npx --yes eas-cli@latest build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/campus-360.apk"
          ls -lh "$RUNNER_TEMP/campus-360.apk"

      - name: Keep the APK as a workflow artifact (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: campus-360-apk
          path: ${{ runner.temp }}/campus-360.apk
          if-no-files-found: error
          retention-days: 30

      # Public pre-release so the VPS can fetch the APK itself (curl), without
      # going through a developer's connection.
      - name: Publish the APK as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./app.json').expo.version")
          tag="apk-v${version}-${{ github.run_number }}"
          sha=$(sha256sum "$RUNNER_TEMP/campus-360.apk" | cut -d' ' -f1)
          gh release create "$tag" "$RUNNER_TEMP/campus-360.apk" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Campus 360 APK ${version} (build ${{ github.run_number }})" \
            --notes "APK Android ${version}, commit ${{ github.sha }}. SHA-256 : ${sha}"
          echo "Release: $tag (SHA-256 $sha)"
