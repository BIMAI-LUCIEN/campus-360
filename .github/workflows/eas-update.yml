name: Publish OTA update (EAS Update)

# Pushes an over-the-air (OTA) JavaScript/asset update to already-installed
# Campus 360 apps on the "production" channel. Installed apps pick it up on the
# next launch — no reinstall needed.
#
# IMPORTANT: OTA only ships JS/TS and asset changes. Native changes (new native
# modules, permissions, most app.json native config, or an Expo SDK bump) still
# require a fresh APK build + install. When in doubt, rebuild.
#
# Required GitHub repository secret:
#   - EXPO_TOKEN: an Expo access token (https://expo.dev/settings/access-tokens)
#                 with permission to publish updates on the campus-360 project.

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Update message"
        required: false
        default: "Manual OTA update"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "App.tsx"
      - "index.ts"
      - "assets/**"
      - "app.json"
      - ".github/workflows/eas-update.yml"

# Never run OTA publishes concurrently — the latest push wins.
concurrency:
  group: eas-update-production
  cancel-in-progress: true

jobs:
  publish-ota:
    name: eas update · production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euxo pipefail
          MESSAGE="${{ github.event.inputs.message || github.event.head_commit.message || 'OTA update' }}"
          # Keep the message single-line and bounded.
          MESSAGE=$(printf '%s' "$MESSAGE" | head -n 1 | cut -c1-140)
          npx --yes eas-cli@latest update \
            --branch production \
            --message "$MESSAGE" \
            --non-interactive
