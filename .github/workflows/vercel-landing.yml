name: Deploy Landing Site to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'landing-site/**'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LANDING_PROJECT_ID }}

jobs:
  deploy-landing:
    name: Deploy landing-site to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing-site/package-lock.json

      - name: Install dependencies
        run: cd landing-site && npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: cd landing-site && vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel App
        run: cd landing-site && vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: cd landing-site && vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
